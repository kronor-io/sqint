name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  # Any base branch, so a pull request stacked on another one is checked too.
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

# GitHub-hosted runners only, as for every public kronor repository: a
# self-hosted runner would run pull requests from forks on kronor's own machines.
# Every job reads from the kronor-open cache and pushes what it builds there, so
# each package is built once and nix run github:kronor-io/sqint finds a binary.
jobs:
  nix-matrix:
    name: Generate nix github actions matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@96951a368ba55167b55f1c916f7d416bac6505fe # v31.10.3
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
      - uses: cachix/cachix-action@1eb2ef646ac0255473d23a5907ad7b04ce94065c # v17
        with:
          name: kronor-open
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
      - id: set-matrix
        name: Generate Nix Matrix
        run: |
          set -Eeu
          matrix="$(nix eval --json '.#githubActions.matrix')"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  # sqint, its tests and the Docker image, on each system the flake supports.
  nix-build:
    name: ${{ matrix.name }} (${{ matrix.system }})
    needs: nix-matrix
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.nix-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@96951a368ba55167b55f1c916f7d416bac6505fe # v31.10.3
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
      - uses: cachix/cachix-action@1eb2ef646ac0255473d23a5907ad7b04ce94065c # v17
        with:
          name: kronor-open
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
      - name: Build
        run: nix build -L .#"${MATRIX_ATTR}"
        env:
          MATRIX_ATTR: ${{ matrix.attr }}

  # Formatting and hlint, in the dev shell.
  lint:
    name: Lint
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@96951a368ba55167b55f1c916f7d416bac6505fe # v31.10.3
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
      - uses: cachix/cachix-action@1eb2ef646ac0255473d23a5907ad7b04ce94065c # v17
        with:
          name: kronor-open
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
      - name: Lint
        run: nix develop -L --command scripts/lint

  # On a version tag, the image for each architecture, then one tag for both.
  release-image:
    name: Release image (${{ matrix.arch }})
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [nix-build, lint]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, arch: amd64 }
          - { os: ubuntu-24.04-arm, arch: arm64 }
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@96951a368ba55167b55f1c916f7d416bac6505fe # v31.10.3
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
      - uses: cachix/cachix-action@1eb2ef646ac0255473d23a5907ad7b04ce94065c # v17
        with:
          name: kronor-open
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
      - name: Build image
        run: nix build -L .#dockerImage
      - uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push image
        env:
          REPOSITORY: ${{ github.repository }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -Eeu
          image="ghcr.io/${REPOSITORY,,}"
          version="${GITHUB_REF_NAME#v}"
          docker load < result
          docker tag sqint:latest "$image:$version-$ARCH"
          docker push "$image:$version-$ARCH"

  # On a version tag, sqint linked statically for each Linux architecture
  # (scripts/build-static), for the release job to attach.
  release-binary:
    name: Release binary (${{ matrix.arch }})
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [nix-build, lint]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, arch: x86_64 }
          - { os: ubuntu-24.04-arm, arch: aarch64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # cabal's store, so a release builds only what changed since the last one.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: dist-static/cabal
          key: build-static-${{ matrix.arch }}-${{ hashFiles('cabal.project', 'cabal.project.freeze', 'scripts/build-static') }}
          restore-keys: build-static-${{ matrix.arch }}-
      - name: Build
        run: scripts/build-static
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sqint-${{ matrix.arch }}-linux
          path: dist-static/sqint-${{ matrix.arch }}-linux.tar.xz
          if-no-files-found: error

  # Both tarballs and their checksums on the tag's GitHub release, which this
  # creates when nobody has yet.
  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release-binary
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sqint-*-linux
          merge-multiple: true
          path: release
      - name: Attach the binaries
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -Eeu
          cd release
          sha256sum sqint-*-linux.tar.xz > SHA256SUMS
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" sqint-*-linux.tar.xz SHA256SUMS --clobber

  release-manifest:
    name: Release image tags
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag the version and latest for both architectures
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          set -Eeu
          image="ghcr.io/${REPOSITORY,,}"
          version="${GITHUB_REF_NAME#v}"
          for tag in "$version" latest; do
            docker manifest create "$image:$tag" "$image:$version-amd64" "$image:$version-arm64"
            docker manifest push "$image:$tag"
          done
