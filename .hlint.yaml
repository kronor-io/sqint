# Plain hlint, plus the rules sqint is written to.
- arguments: [-XQuasiQuotes, -XOverloadedRecordDot, -XMultilineStrings]

- ignore: {name: Use underscore}
- ignore: {name: Eta reduce}
- ignore: {name: Use const}
- ignore: {name: Use unless}
- ignore: {name: Use section}
- ignore: {name: Use ?~}
- ignore: {name: Redundant bracket}
- ignore: {name: Functor law}
- ignore: {name: Use newtype instead of data}

# Partial or unsafe functions.
- functions:
    - {name: undefined, within: []}
    - {name: fromJust, within: []}
    - {name: unsafePerformIO, within: []}
    - {name: unsafeCoerce, within: []}
    - {name: "Data.Map.!", within: []}
    - {name: "Data.Map.Strict.!", within: []}
    - {name: "RIO.Map.!", within: []}
    - {name: nub, within: []} # O(n^2)
    - {name: Data.Text.Encoding.decodeUtf8, within: [], message: "decodeUtf8 is partial, use decodeUtf8Lenient instead"}

- warn:
    name: "Use string interpolation instead of <> chains"
    lhs: 'a <> x <> b'
    rhs: '[iii|#{a}#{x}#{b}|]'
    side: 'isLitString a && isLitString b'
    note: |
      Long <> chains over string literals are hard to read.
      Use [iii|...#{var}...|] from Data.String.Interpolate, or
      """multi-line text""" where -XMultilineStrings is on.
